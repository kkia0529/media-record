<div id="shelfTagPickerPanel" class="tag-picker-panel">
  <div class="tag-picker-scroll-area">

  <!-- 視圖切換的簡單 JavaScript 邏輯 -->
  <script>

/* ==========================================================
   書架篩選與標籤彈窗核心邏輯 (shelf.js)
   ========================================================== */

// 1. 分類模組化配置 (日後若更換頁面，僅需微調此設定檔)
const CURRENT_CATEGORY = "novel";     // 大分類
const CURRENT_SUB_CATEGORY = "原創"; // 細類 (如：原創、綜英美、動畫...)

// 篩選欄位與偵測欄位對照配置
const FILTER_FIELDS_CONFIG = {
  // 關鍵字搜尋涵蓋的欄位 (手動輸入文字)
  keywordFields: ["title", "author", "intro", "remark", "thoughts"],
  // 精確匹配的下拉選單欄位
  selectFields: {
    gender: "filterGender",
    progress: "filterProgress",
    status: "filterStatus",
    rating: "filterRating"
  }
};

// 篩選狀態暫存
let selectedFilterTags = [];     // 已確認套用的標籤
let tempShelfFilterTags = [];    // 小彈窗中臨時勾選的標籤

document.addEventListener("DOMContentLoaded", () => {
  initShelfTagPicker();
  bindFilterEvents();
  
  // 離開頁面重新回來時，預設自動清空所有篩選欄位並展示全量資料
  resetAllFilters();
});



// 綁定確認與清除按鈕事件
function bindFilterEvents() {
  const btnConfirm = document.getElementById("btnConfirmFilter");
  const btnClear = document.getElementById("btnClearFilter");
  const keywordInput = document.getElementById("filterKeyword");

  if (btnConfirm) {
    btnConfirm.addEventListener("click", applyBookFilters);
  }

  if (btnClear) {
    btnClear.addEventListener("click", () => {
      resetAllFilters();
      applyBookFilters();
    });
  }

  // 按下 Enter 鍵時快速觸發篩選
  if (keywordInput) {
    keywordInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") applyBookFilters();
    });
  }
}

// 重置所有篩選 UI
function resetAllFilters() {
  document.getElementById("filterKeyword").value = "";
  document.getElementById("filterGender").value = "";
  document.getElementById("filterProgress").value = "";
  document.getElementById("filterStatus").value = "";
  document.getElementById("filterRating").value = "";
  document.getElementById("filterTagInput").value = "";
  selectedFilterTags = [];
  tempShelfFilterTags = [];
}

// 核心多條件篩選演算法 (完全符合 AND 邏輯)
function applyBookFilters() {
  const keyword = document.getElementById("filterKeyword").value.trim().toLowerCase();
  const gender = document.getElementById("filterGender").value;
  const progress = document.getElementById("filterProgress").value;
  const status = document.getElementById("filterStatus").value;
  const rating = document.getElementById("filterRating").value;

  // 從全域 bookDatabase 進行過濾
  const filteredBooks = bookDatabase.filter(book => {
    // 0. 基礎分類過濾 (屬於當前細類)
    if (book.category !== CURRENT_CATEGORY) return false;
    if (CURRENT_SUB_CATEGORY && book.subCategory !== CURRENT_SUB_CATEGORY) return false;

    // 1. 關鍵字過濾 (書名/作者/簡介/備註/心得)
    if (keyword) {
      const matchKeyword = FILTER_FIELDS_CONFIG.keywordFields.some(field => {
        const value = book[field];
        return value && String(value).toLowerCase().includes(keyword);
      });
      if (!matchKeyword) return false;
    }

    // 2. 性向過濾
    if (gender && book.gender !== gender) return false;

    // 3. 進度過濾
    if (progress && book.progress !== progress) return false;

    // 4. 狀態過濾
    if (status && book.status !== status) return false;

    // 5. 評分過濾
    if (rating !== "" && Number(book.rating) !== Number(rating)) return false;

    // 6. 標籤過濾 (需要完全包含所有選中的標籤)
    if (selectedFilterTags.length > 0) {
      const bookTags = book.tags || [];
      const hasAllTags = selectedFilterTags.every(t => bookTags.includes(t));
      if (!hasAllTags) return false;
    }

    return true;
  });

  // 渲染篩選後的結果至卡片與表格視圖
  renderFilteredResults(filteredBooks);
}

// 渲染篩選後的結果至卡片與表格視圖
function renderFilteredResults(books) {
  // 呼叫 main.js 中真實存在的渲染函式
  if (typeof renderShelf === "function") {
    renderShelf(books);
  }
}

/* ==========================================================
   標籤小彈窗互動控制 (即點即加 / 自動關閉)
   ========================================================== */
function initShelfTagPicker() {
  const tagInput = document.getElementById("filterTagInput");
  const pickerPanel = document.getElementById("shelfTagPickerPanel");

  if (!tagInput || !pickerPanel) return;

  // 1. 點擊輸入框：切換彈窗顯示/收起 (需求 4)
  tagInput.addEventListener("click", (e) => {
    e.stopPropagation();
    
    const isShowing = pickerPanel.classList.contains("active");
    if (isShowing) {
      pickerPanel.classList.remove("active");
    } else {
      // 定位彈窗於輸入框正下方
      const rect = tagInput.getBoundingClientRect();
      pickerPanel.style.top = `${rect.bottom + window.scrollY + 5}px`;
      pickerPanel.style.left = `${rect.left + window.scrollX}px`;

      renderShelfPickerTags();
      pickerPanel.classList.add("active");
    }
  });

  // 2. 阻止彈窗內部點擊冒泡
  pickerPanel.addEventListener("click", (e) => e.stopPropagation());

  // 3. 點擊周圍空白地區收起彈窗 (需求 4)
  document.addEventListener("click", () => {
    pickerPanel.classList.remove("active");
  });
}

// 渲染小彈窗內的可選標籤與即點即更新邏輯
function renderShelfPickerTags() {
  const container = document.getElementById("shelfAvailableTagsContainer");
  const tagInput = document.getElementById("filterTagInput");
  if (!container) return;
  container.innerHTML = "";

  // 取得當前頁面的標籤庫
  const mainCatNameMap = { novel: "小說", comic: "漫畫", video: "影視", game: "遊戲" };
  const fullKey = `${mainCatNameMap[CURRENT_CATEGORY]}_${CURRENT_SUB_CATEGORY}`;
  
  const pool = (typeof tagDatabase !== "undefined" && tagDatabase[fullKey]) ? tagDatabase[fullKey] : [];
  const sortedPool = (typeof sortTags === "function") ? sortTags([...pool]) : pool;

  sortedPool.forEach(tag => {
    const colorKey = tag.color || 'c1';
    const colorConfig = (typeof TAG_COLORS !== 'undefined' && TAG_COLORS[colorKey]) 
      ? TAG_COLORS[colorKey] 
      : { bg: "#b5aba0", text: "#ffffff" };

    const span = document.createElement("span");
    span.className = "picker-tag-item";
    span.textContent = tag.name;
    span.style.backgroundColor = colorConfig.bg;
    span.style.color = colorConfig.text;

    // 判斷是否已被勾選
    if (selectedFilterTags.includes(tag.name)) {
      span.classList.add("selected");
    }

    // 4. 每點擊一個標籤：自動加入/取消標籤並更新輸入框與篩選結果 (需求 3)
    span.onclick = (e) => {
      e.stopPropagation();
      
      if (selectedFilterTags.includes(tag.name)) {
        selectedFilterTags = selectedFilterTags.filter(t => t !== tag.name);
      } else {
        selectedFilterTags.push(tag.name);
      }

      // 同步更新輸入框顯示
      if (tagInput) {
        tagInput.value = selectedFilterTags.length > 0 
          ? selectedFilterTags.join(", ") 
          : "";
      }

      // 重新渲染彈窗內標籤的勾選狀態
      renderShelfPickerTags();

      // 即時觸發書架列表篩選
      if (typeof applyBookFilters === "function") {
        applyBookFilters();
      }
    };

    container.appendChild(span);
  });
}

  </script>
