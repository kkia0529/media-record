<script>
// 全域變數定義
let currentRating = 0;
let currentBookTags = [];      // 最終已確認的標籤
let tempSelectedTags = [];     // 彈窗開啟時的臨時標籤快照（用於取消時還原）

// 大彈窗專用暫存變數
let manageTagsTemp = {};        // 深拷貝資料庫標籤庫
let selectedTagIndex = null;   // 目前選中的標籤 Index (null 代表新增模式)
let selectedColorKey = 'c1';    // 目前選中的顏色 key
let contextMenuTargetIndex = null; // 右鍵欲刪除的標籤 index

// 動態根據大分類初始化詳細頁面的分類下拉選項
function initCategoryOptions(mainCategory) {
  const categorySelect = document.getElementById('editCategorySelect');
  if (!categorySelect || typeof mediaOptionsConfig === 'undefined') return;

  const config = mediaOptionsConfig[mainCategory];
  if (config && config.types) {
    categorySelect.innerHTML = config.types.map(t => `<option value="${t}">${t}</option>`).join('');
  }
}

// 取得當前大分類與細類組合的 key
function getFullCategoryKey() {
  const urlParams = new URLSearchParams(window.location.search);
  const mainCatKey = urlParams.get('category') || 'novel';

  const mainCatMap = {
    novel: "小說",
    comic: "漫畫",
    video: "影視",
    game: "遊戲"
  };

  const mainCatName = mainCatMap[mainCatKey] || "小說";

  // 漫畫沒有細類，統一固定讀取 '漫畫_漫畫'
  if (mainCatKey === 'comic') {
    return '漫畫_漫畫';
  }

  const categorySelect = document.getElementById('editCategorySelect');
  const subCategory = categorySelect?.value || urlParams.get('sub') || '';

  return subCategory ? `${mainCatName}_${subCategory}` : `${mainCatName}_${mainCatName}`;
}

// 2. 採用跟書架篩選一樣的雙重讀取邏輯 (tagDatabase + bookDatabase)
function renderAvailablePickerTags() {
  const container = document.getElementById('availableTagsContainer');
  if (!container) return;
  container.innerHTML = '';

  const currentKey = getFullCategoryKey();
  const urlParams = new URLSearchParams(window.location.search);
  const mainCatKey = urlParams.get('category') || 'novel';

  const uniqueTagsMap = new Map();

  // A. 從 tagDatabase 讀取預設標籤
  if (typeof tagDatabase !== 'undefined' && tagDatabase[currentKey]) {
    tagDatabase[currentKey].forEach(tag => {
      const tagName = typeof tag === 'string' ? tag : (tag ? tag.name : null);
      const tagColor = (typeof tag === 'object' && tag.color) ? tag.color : 'c1';
      if (tagName) {
        uniqueTagsMap.set(tagName, { name: tagName, color: tagColor });
      }
    });
  }

  // B. 同步書架篩選邏輯：從 bookDatabase 撈取該大類已使用的所有標籤，補足未在 tagDatabase 的標籤
  if (typeof bookDatabase !== 'undefined') {
    bookDatabase.forEach(book => {
      if (book.category === mainCatKey && Array.isArray(book.tags)) {
        book.tags.forEach(tag => {
          const tagName = typeof tag === 'string' ? tag : (tag ? tag.name : null);
          if (tagName && !uniqueTagsMap.has(tagName)) {
            uniqueTagsMap.set(tagName, { name: tagName, color: 'c1' });
          }
        });
      }
    });
  }

  const pool = Array.from(uniqueTagsMap.values());
  const sortedPool = (typeof sortTags === 'function') ? sortTags(pool) : pool;

  sortedPool.forEach(tag => {
    const colorKey = tag.color || 'c1';
    const colorConfig = (typeof TAG_COLORS !== 'undefined' && TAG_COLORS[colorKey]) 
      ? TAG_COLORS[colorKey] 
      : { bg: "#b5aba0", text: "#ffffff" };

    const span = document.createElement('span');
    span.className = 'picker-tag-item tag-pill';
    span.textContent = tag.name;
    span.style.backgroundColor = colorConfig.bg;
    span.style.color = colorConfig.text;

    if (tempSelectedTags.includes(tag.name)) {
      span.classList.add('selected');
    }

    span.onclick = (e) => {
      e.stopPropagation();
      if (tempSelectedTags.includes(tag.name)) {
        tempSelectedTags = tempSelectedTags.filter(t => t !== tag.name);
      } else {
        tempSelectedTags.push(tag.name);
      }
      renderAvailablePickerTags();
      renderSelectedTags();
    };

    container.appendChild(span);
  });
}



document.addEventListener("DOMContentLoaded", () => {
  // 1. 初始化日曆外掛 (Flatpickr)
  if (typeof flatpickr !== 'undefined') {
    flatpickr("#startDateInput, #completeDateInput", {
      dateFormat: "Y/m/d",
      allowInput: true,
      disableMobile: "true"
    });
  }

  // 2. 星星點擊事件綁定
  const starContainer = document.querySelector('.star-rating');
  if (starContainer) {
    starContainer.style.cursor = 'pointer';
    starContainer.addEventListener('click', handleStarClick);
  }

  // 3. 標籤彈窗開啟與關閉邏輯
  const tagLabel = document.querySelector('.right-column-sections .text-block-label');
  const selectedTagsContainer = document.getElementById('selectedTagsContainer');
  const tagPickerPanel = document.getElementById('tagPickerPanel');
  const editCategorySelect = document.getElementById('editCategorySelect'); // 頁面細類下拉框

  const btnTagCancel = document.getElementById('btnTagCancel');
  const btnTagConfirm = document.getElementById('btnTagConfirm');
  const btnTagGoEdit = document.getElementById('btnTagGoEdit');

  // 開啟彈窗函式
  const openPickerPanel = (e) => {
    if (document.body.classList.contains('edit-state')) {
      e.stopPropagation();
      
      // 每次打開時，將目前生效的 currentBookTags 複製給暫存快照 tempSelectedTags
      tempSelectedTags = [...currentBookTags];
      
      // 重新渲染小彈窗與已選區
      renderSelectedTags();
      renderAvailablePickerTags(); 
      
      if (tagPickerPanel) tagPickerPanel.classList.add('active');
    }
  };

  // 當使用者在編輯模式下切換左側「分類/細類」選單時，同步刷新下方的標籤庫
  if (editCategorySelect) {
    editCategorySelect.addEventListener('change', () => {
      // 若標籤庫隨細類切換，自動過濾掉不屬於新細類的標籤或重新對應
      renderSelectedTags();
      renderAvailablePickerTags();
    });
  }

  // 點擊標題或已選標籤區域均可打開彈窗
  if (tagLabel) tagLabel.addEventListener('click', openPickerPanel);
  if (selectedTagsContainer) selectedTagsContainer.addEventListener('click', openPickerPanel);

  // 阻止彈窗內部的點擊事件冒泡
  if (tagPickerPanel) {
    tagPickerPanel.addEventListener('click', (e) => e.stopPropagation());
  }

  // ★ 需求 1：取消按鈕 - 不套用變更，還原備份並關閉彈窗
  if (btnTagCancel) {
    btnTagCancel.addEventListener('click', (e) => {
      e.stopPropagation();
      tempSelectedTags = []; // 清空暫存
      if (tagPickerPanel) tagPickerPanel.classList.remove('active');
    });
  }

  // ★ 需求 1：確認按鈕 - 儲存變更，更新 currentBookTags 並關閉彈窗
  if (btnTagConfirm) {
    btnTagConfirm.addEventListener('click', (e) => {
      e.stopPropagation();
      currentBookTags = [...tempSelectedTags]; // 寫入真正生效的標籤
      renderSelectedTags();                    // 更新上方顯示區
      if (tagPickerPanel) tagPickerPanel.classList.remove('active');
    });
  }

  // ★ 需求 4：左側跳轉編輯按鈕
  if (btnTagGoEdit) {
      btnTagGoEdit.addEventListener('click', (e) => {
        e.stopPropagation();
        // 關閉小選單彈窗
        if (tagPickerPanel) tagPickerPanel.classList.remove('active');
        // 開啟大管理彈窗
        openManageTagsModal();
      });
    }

  // 大彈窗內的連動選單初始化與事件對應
  initManageCategorySelects();

  // 色彩選取按鈕點擊事件
  document.querySelectorAll('#colorPickerDots .color-dot').forEach(dot => {
    dot.addEventListener('click', (e) => {
      document.querySelectorAll('#colorPickerDots .color-dot').forEach(d => d.classList.remove('active'));
      e.target.classList.add('active');

  // 2. 點擊全域任意處自動隱藏標籤右鍵選單

  const editSelectCat = document.getElementById('editCategorySelect');

// 大彈窗連動選單邏輯 (需求 3)
function initManageCategorySelects() {
  const mainSelect = document.getElementById('manageMainCategorySelect');
  const subSelect = document.getElementById('manageSubCategorySelect');

  const mainCategories = [
    { key: "novel", text: "小說" },
    { key: "comic", text: "漫畫" },
    { key: "video", text: "影視" },
    { key: "game", text: "遊戲" }
  ];

  mainSelect.innerHTML = mainCategories.map(c => `<option value="${c.key}">${c.text}</option>`).join('');

  mainSelect.addEventListener('change', () => {
    updateManageSubSelect(mainSelect.value);
  });

  subSelect.addEventListener('change', () => {
    resetManageEditForm();
    renderManageTagsList();
  });
}

function updateManageSubSelect(mainKey, defaultSub = null) {
  const subSelect = document.getElementById('manageSubCategorySelect');
  const config = mediaOptionsConfig[mainKey];

  if (mainKey === 'comic' || !config || !config.types) {
    subSelect.innerHTML = '<option value=""></option>';
    subSelect.disabled = true;
  } else {
    subSelect.disabled = false;
    subSelect.innerHTML = config.types.map(t => `<option value="${t}">${t}</option>`).join('');
    if (defaultSub && config.types.includes(defaultSub)) {
      subSelect.value = defaultSub;
    }
  }

  resetManageEditForm();
  renderManageTagsList();
}

// 開啟大標籤管理彈窗並同步目前書籍分類
function openManageTagsModal() {
  manageTagsTemp = JSON.parse(JSON.stringify(tagDatabase));

  const urlParams = new URLSearchParams(window.location.search);

  // 優先使用目前書籍真正的 category
  const bookId = urlParams.get('id');
  const currentBook = (typeof bookDatabase !== 'undefined')
    ? bookDatabase.find(book => book.id === bookId)

  }

// 渲染大彈窗內的標籤陣列
function renderManageTagsList() {
  const container = document.getElementById('manageTagsListContainer');
  if (!container) return;
  container.innerHTML = '';

  const mainSelect = document.getElementById('manageMainCategorySelect');
  const subSelect = document.getElementById('manageSubCategorySelect');
  
  // 取得目前大彈窗真正使用的標籤庫 Key
  let fullKey;
  if (mainSelect.value === 'comic') {
    // 漫畫所有細類共用同一套標籤
    fullKey = '漫畫_漫畫';
  } else {
    const mainCatMap = {
      novel: "小說",
      video: "影視",
      game: "遊戲"
    };
    const mainCatName = mainCatMap[mainSelect.value] || "小說";
    fullKey = `${mainCatName}_${subSelect.value}`;
  }

  const pool = manageTagsTemp[fullKey] || [];

  const sortedPool = (typeof sortTags === 'function') ? sortTags([...pool]) : pool;

  sortedPool.forEach((tag) => {
    const originalIndex = pool.indexOf(tag);
    const colorConfig = TAG_COLORS[tag.color] || { bg: '#b5aba0', text: '#ffffff' };
    const tagEl = document.createElement('div');
    tagEl.className = 'manage-tag-item' + (selectedTagIndex === originalIndex ? ' selected' : '');
    tagEl.style.backgroundColor = colorConfig.bg;
    tagEl.style.color = colorConfig.text;
    tagEl.textContent = tag.name;

// 左鍵點擊：編輯標籤名稱與顏色
    tagEl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (selectedTagIndex === originalIndex) {
        resetManageEditForm();
      } else {
        selectedTagIndex = originalIndex;
        document.getElementById('manageTagNameInput').value = tag.name;
        selectedColorKey = tag.color || 'c1';
        
        document.querySelectorAll('#colorPickerDots .color-dot').forEach(dot => {
          dot.classList.toggle('active', dot.getAttribute('data-color') === selectedColorKey);
        });
      }
      renderManageTagsList();
    });

// ★ 補上這段：右鍵點擊事件 (彈出刪除選單)
    tagEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();

      const tagMenu = document.getElementById('manageTagContextMenu');
      if (!tagMenu) return;

      // 計算縮放後的座標，防止 3D 縮放偏移
      const containerEl = document.querySelector('.app-container');
      let scale = 1;
      if (containerEl) {
        const transformVal = window.getComputedStyle(containerEl).transform;
        if (transformVal !== 'none') {
          const matrixValues = transformVal.match(/matrix\((.+)\)/);
          if (matrixValues) scale = parseFloat(matrixValues[1].split(',')[0]);
        }
      }

      const rect = document.body.getBoundingClientRect();
      const mouseX = (e.clientX - rect.left) / scale;
      const mouseY = (e.clientY - rect.top) / scale;

      tagMenu.style.left = `${mouseX}px`;
      tagMenu.style.top = `${mouseY}px`;
      tagMenu.style.display = 'block';

      // 紀錄當前欲刪除的資料 Key 與陣列索引
      tagMenu.dataset.fullKey = fullKey;
      tagMenu.dataset.targetIndex = originalIndex;
    });

    container.appendChild(tagEl);
  });
}

// 重置編輯狀態為預設新增
function resetManageEditForm() {
  selectedTagIndex = null;
  document.getElementById('manageTagNameInput').value = '';
  selectedColorKey = 'c1';
  document.querySelectorAll('#colorPickerDots .color-dot').forEach(dot => {
    dot.classList.toggle('active', dot.getAttribute('data-color') === 'c1');
  });
  document.getElementById('btnManageTagConfirm').classList.remove('edit-mode');
}

// 處理新增或修改標籤點擊
function handleManageTagConfirm() {
  const mainSelect = document.getElementById('manageMainCategorySelect');
  const subSelect = document.getElementById('manageSubCategorySelect');

  let fullKey;

  // 漫畫所有細類統一使用同一套標籤庫
  if (mainSelect.value === 'comic') {
    fullKey = '漫畫_漫畫';
  } else {
    const mainCatMap = {
      novel: "小說",
      video: "影視",
      game: "遊戲"
    };
    const mainCatName = mainCatMap[mainSelect.value] || "小說";
    fullKey = `${mainCatName}_${subSelect.value}`;
  }

  const inputEl = document.getElementById('manageTagNameInput');
  const nameStr = inputEl.value.trim();

  if (!nameStr) return;
  if (!manageTagsTemp[fullKey]) manageTagsTemp[fullKey] = [];

  const pool = manageTagsTemp[fullKey];

  if (selectedTagIndex === null) {
    if (pool.some(t => t.name === nameStr)) {
      alert('該細類下已有相同名稱的標籤！');
      return;
    }
    pool.push({ name: nameStr, color: selectedColorKey });
  } else {
    pool[selectedTagIndex] = { name: nameStr, color: selectedColorKey };
  }

  if (typeof sortTags === 'function') {
    manageTagsTemp[fullKey] = sortTags(pool);
  }

  resetManageEditForm();
  renderManageTagsList();
}

// 填入資料到畫面
function fillBookData(book) {

// 1. 根據書籍的大分類切換背景圖與分類下拉選項
  const categoryKey = book.category || 'novel';
  updateDetailPanelBackground(categoryKey);
  initCategoryOptions(categoryKey); // 動態填入該大分類對應的細類

const viewOnlyCat = document.getElementById('categoryText');
  const editSelectCat = document.getElementById('editCategorySelect');
  const defaultSub = book.subCategory || (categoryKey === 'comic' ? '韓漫' : '原創');

  if (viewOnlyCat) viewOnlyCat.textContent = defaultSub;
  if (editSelectCat) editSelectCat.value = defaultSub;

  if (typeof initDetailOptions === 'function') {
    initDetailOptions(book.category || 'novel', book);
  }

  window.currentCoverBase64 = book.cover || '';
  if (typeof renderCoverImage === 'function') {
    renderCoverImage(window.currentCoverBase64);
  }

  const middleCol = document.querySelector('.middle-column');
  if (middleCol) {
    const titleRow = middleCol.querySelector('.info-row:nth-child(1)');
    if (titleRow) {
      titleRow.querySelector('.view-only').textContent = book.title || '';
      titleRow.querySelector('.edit-input').value = book.title || '';
    }

    const authorRow = middleCol.querySelector('.info-row:nth-child(2)');
    if (authorRow) {
      authorRow.querySelector('.view-only').textContent = book.author || '';
      authorRow.querySelector('.edit-input').value = book.author || '';
    }

    const genderRow = middleCol.querySelector('.info-row:nth-child(3)');
    if (genderRow) {
      const genderMap = { bg: "言情", bl: "純愛", no_cp: "無CP", no_cp_female: "無CP女主", no_cp_male: "無CP男主" };
      genderRow.querySelector('.view-only').textContent = genderMap[book.gender] || book.gender || '言情';
      genderRow.querySelector('.edit-select').value = book.gender || 'bg';
    }
  }

  // ★ 補上這段：讀取與初始化跳轉網址
  window.currentReadLink = book.readLink || '';
  const readBtnGroup = document.querySelector('.read-btn-group');
  if (readBtnGroup) {
    readBtnGroup.href = window.currentReadLink || '#';
    if (window.currentReadLink) {
      readBtnGroup.setAttribute('target', '_blank');
      readBtnGroup.setAttribute('rel', 'noopener noreferrer');
    } else {
      readBtnGroup.removeAttribute('target');
      readBtnGroup.removeAttribute('rel');
    }
  }

  currentRating = Number(book.rating) || 0;
  renderStarRating(currentRating);

  const progressTextEl = document.getElementById('progressText');
  if (progressTextEl) progressTextEl.textContent = book.progress || '';

  const statusTextEl = document.getElementById('statusText');
  if (statusTextEl) statusTextEl.textContent = book.status || '';

  const editProgressSelect = document.getElementById('editProgressSelect');
  if (editProgressSelect) editProgressSelect.value = book.progress || '';

  const editStatusSelect = document.getElementById('editStatusSelect');
  if (editStatusSelect) editStatusSelect.value = book.status || '';

  document.getElementById('startDateText').textContent = book.startDate || '';
  document.getElementById('startDateInput').value = book.startDate || '';
  document.getElementById('completeDateText').textContent = book.completeDate || '';
  document.getElementById('completeDateInput').value = book.completeDate || '';

  const textBlocks = document.querySelectorAll('.fixed-text-box');
  if (textBlocks[0]) {
    textBlocks[0].querySelector('.view-only').textContent = book.intro || '';
    textBlocks[0].querySelector('.edit-textarea').value = book.intro || '';
  }
  if (textBlocks[1]) {
    textBlocks[1].querySelector('.view-only').textContent = book.remark || '';
    textBlocks[1].querySelector('.edit-textarea').value = book.remark || '';
  }
  if (textBlocks[2]) {
    textBlocks[2].querySelector('.view-only').textContent = book.thoughts || '';
    textBlocks[2].querySelector('.edit-textarea').value = book.thoughts || '';
  }

  currentBookTags = book.tags ? [...book.tags] : [];
  renderSelectedTags();
  renderAvailablePickerTags();

  if (typeof updateOngoingUI === 'function') {
    updateOngoingUI(book.isOngoing);
  }
}

// 渲染「上方紅圈區」已選取的標籤
function renderSelectedTags() {
  const container = document.getElementById('selectedTagsContainer');
  if (!container) return;
  container.innerHTML = '';

  const isEdit = document.body.classList.contains('edit-state');
  
  // ★ 修改處：改用 getFullCategoryKey() 取得「大分類_細類」正確 Key (例如: "小說_原創")
  const fullKey = getFullCategoryKey();
  const categoryTagPool = (typeof tagDatabase !== 'undefined' && tagDatabase[fullKey]) ? tagDatabase[fullKey] : [];

  // 根據當前狀態選取對應的標籤陣列 (編輯彈窗開啟時讀取 tempSelectedTags，否則讀取 currentBookTags)
  const tagPickerPanel = document.getElementById('tagPickerPanel');
  const isPanelActive = tagPickerPanel && tagPickerPanel.classList.contains('active');
  const activeTags = (isEdit && isPanelActive) ? tempSelectedTags : currentBookTags;

  const detailedTags = activeTags.map(tagName => {
    const found = categoryTagPool.find(t => t.name === tagName);
    return found || { name: tagName, color: 'c1' };
  });

  const sorted = (typeof sortTags === 'function') ? sortTags(detailedTags) : detailedTags;

  sorted.forEach(tag => {
    const colorConfig = (typeof TAG_COLORS !== 'undefined' && TAG_COLORS[tag.color]) ? TAG_COLORS[tag.color] : { bg: '#b5aba0', text: '#ffffff' };
    const span = document.createElement('span');
    span.className = 'tag-pill' + (isEdit ? ' removable' : '');
    span.textContent = tag.name;
    span.style.backgroundColor = colorConfig.bg;
    span.style.color = colorConfig.text;

    // 只有在彈窗開啟時，點擊上方已選標籤才會將其移除
    if (isEdit) {
      span.onclick = (e) => {
        if (tagPickerPanel && tagPickerPanel.classList.contains('active')) {
          e.stopPropagation();
          // 更新暫存陣列並【同時更新上下兩區】
          tempSelectedTags = tempSelectedTags.filter(t => t !== tag.name);
          renderSelectedTags();
          renderAvailablePickerTags();
        }
      };

    }

    container.appendChild(span);
  });
}

//彈窗選取
function renderAvailablePickerTags() {
  const container = document.getElementById('availableTagsContainer');
  if (!container) return;
  container.innerHTML = '';

  // 1. 取得當前頁面對應的標籤庫 Key (例如 "小說_原創" 或 "漫畫_漫畫")
  const currentKey = getFullCategoryKey();
  
  // 優先從全域 tagDatabase 或 localStorage 讀取最新標籤
  let rawTags = tagDatabase[currentKey] || [];

  // 如果 tagDatabase 裡面是空的，嘗試補救從 localStorage 讀取
  if (rawTags.length === 0) {
    const saved = localStorage.getItem('tagDatabase');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        rawTags = parsed[currentKey] || [];
      } catch(e){}
    }
  }

  // 2. 格式化標籤資料 (支援字串或物件)
  let tagList = rawTags.map(tag => {
    if (typeof tag === 'string') {
      return { name: tag, color: 'c1' };
    }
    return tag;
  });

  // 3. 排序標籤 (若有 sortTags 函式)
  if (typeof sortTags === 'function') {
    tagList = sortTags(tagList);
  }

  // 4. 動態渲染標籤顆粒到小彈窗中
  tagList.forEach(tag => {
    const colorKey = tag.color || 'c1';
    const colorConfig = (typeof TAG_COLORS !== 'undefined' && TAG_COLORS[colorKey]) 
      ? TAG_COLORS[colorKey] 
      : { bg: "#b5aba0", text: "#ffffff" };

    const span = document.createElement('span');
    span.className = 'picker-tag-item tag-pill';
    span.textContent = tag.name;
    span.style.backgroundColor = colorConfig.bg;
    span.style.color = colorConfig.text;

    // 比對當前暫存陣列 (tempSelectedTags) 決定是否加上高亮選中樣式
    if (tempSelectedTags.includes(tag.name)) {
      span.classList.add('selected');
    }

    // 點擊切換選取狀態
    span.onclick = (e) => {
      e.stopPropagation();
      if (tempSelectedTags.includes(tag.name)) {
        tempSelectedTags = tempSelectedTags.filter(t => t !== tag.name);
      } else {
        tempSelectedTags.push(tag.name);
      }
      // 重新渲染選中狀態與上方已選區
      renderAvailablePickerTags();
      renderSelectedTags();
    };

    container.appendChild(span);
  });
}

// 編輯 / 完成模式切換與儲存
function toggleEditMode() {
  const body = document.getElementById('pageBody');
  const btn = document.getElementById('actionToggleBtn');
  const middleCol = document.querySelector('.middle-column');
  const tagPickerPanel = document.getElementById('tagPickerPanel');

  if (tagPickerPanel) {
    tagPickerPanel.classList.remove('active');
  }

  if (body.classList.contains('edit-state')) {
    const urlParams = new URLSearchParams(window.location.search);
    let bookId = urlParams.get('id');

    // 取得當前選擇的細類與大分類
    const selectedSubCategory = document.getElementById('editCategorySelect').value;
    let computedCategory = urlParams.get('category') || 'novel';
    
    if (typeof mediaOptionsConfig !== 'undefined') {
      for (const [catKey, config] of Object.entries(mediaOptionsConfig)) {
        if (config.types && config.types.includes(selectedSubCategory)) {
          computedCategory = catKey;
          break;
        }
      }
    }

    // 找到既有資料或建立新資料
    let currentBook = bookDatabase.find(book => book.id === bookId);
    
    if (!currentBook) {
      // 若是全新新增的書籍，建立新物件並放入資料庫
      bookId = computedCategory + '_' + Date.now(); 
      currentBook = { id: bookId };
      bookDatabase.push(currentBook);
      
      // 更新 URL 避免重複新增
      window.history.replaceState(null, '', `detail.html?mode=edit&id=${bookId}&category=${computedCategory}`);
    }

    // 更新物件屬性
    currentBook.id = bookId;
    currentBook.cover = window.currentCoverBase64 || '';
    currentBook.readLink = window.currentReadLink || ''; // 儲存跳轉網址
    currentBook.title = middleCol.querySelector('.info-row:nth-child(1) .edit-input').value || '未命名';
    currentBook.author = middleCol.querySelector('.info-row:nth-child(2) .edit-input').value || '';
    currentBook.gender = middleCol.querySelector('.info-row:nth-child(3) .edit-select').value || 'bg';
    currentBook.subCategory = selectedSubCategory;
    currentBook.category = computedCategory;

    currentBook.progress = document.getElementById('editProgressSelect').value || '';
    currentBook.status = document.getElementById('editStatusSelect').value || '';
    currentBook.rating = currentRating;
    currentBook.tags = [...currentBookTags];

    currentBook.startDate = document.getElementById('startDateInput').value || '';
    currentBook.completeDate = document.getElementById('completeDateInput').value || '';

    const textBlocks = document.querySelectorAll('.fixed-text-box');
    if (textBlocks[0]) currentBook.intro = textBlocks[0].querySelector('.edit-textarea').value || '';
    if (textBlocks[1]) currentBook.remark = textBlocks[1].querySelector('.edit-textarea').value || '';
    if (textBlocks[2]) currentBook.thoughts = textBlocks[2].querySelector('.edit-textarea').value || '';

    // 寫入持久化紀錄
    if (typeof saveDatabase === 'function') saveDatabase();
    if (typeof updateLastEditedBook === 'function') updateLastEditedBook(bookId);

    // 即時更新面板背景 UI
    updateDetailPanelBackground(computedCategory);

    // 重新渲染畫面顯示
    fillBookData(currentBook);

    body.classList.remove('edit-state');
    if (btn) btn.textContent = '';
  } else {
    body.classList.add('edit-state');
    if (btn) btn.textContent = '';
    renderSelectedTags();
    renderAvailablePickerTags();
  }
}



</script>
